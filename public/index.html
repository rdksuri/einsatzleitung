<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einsatzleitung — Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --paper:#f2efe9;
    --ink:#1b1d1c;
    --line:#c9c3b6;
    --red:#c8281f;
    --amber:#b8860b;
    --green:#3d6b3a;
    --panel:#ffffff;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{display:flex;flex-direction:column;}

  header{
    background:var(--ink);color:var(--paper);
    padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:10px;
    border-bottom:4px solid var(--red);
  }
  header .title{display:flex;align-items:baseline;gap:10px;}
  header .title h1{font-size:18px;margin:0;letter-spacing:0.02em;font-weight:700;text-transform:uppercase;}
  header .title .sub{font-family:var(--mono);font-size:12px;opacity:0.75;}
  header .status-row{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;}
  .dot.stale{background:var(--amber);}
  .dot.off{background:#888;}

  main{
    flex:1;display:grid;
    grid-template-columns: 360px 1fr;
    gap:0;
    min-height:0;
  }
  @media (max-width: 860px){
    main{grid-template-columns: 1fr; grid-template-rows:auto auto;}
  }

  .panel{
    background:var(--panel);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:18px;
    display:flex;flex-direction:column;gap:18px;
  }
  .card{border:1px solid var(--line);padding:14px;background:var(--panel);}
  .card h2{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;margin:0 0 10px;color:var(--red);font-weight:700;}

  label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;margin-top:10px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=password], select, textarea{
    width:100%;padding:8px;border:1px solid var(--line);background:var(--paper);
    font-family:var(--sans);font-size:14px;color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--red);outline-offset:1px;}
  textarea{resize:vertical;min-height:50px;}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  button{
    font-family:var(--sans);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.03em;
    padding:10px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;
  }
  button.secondary{background:var(--panel);color:var(--ink);}
  button.danger{background:var(--red);border-color:var(--red);color:#fff;}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  button:hover:not(:disabled){filter:brightness(1.15);}

  .big-number{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1;}
  .field-note{font-size:11px;color:#666;margin-top:4px;}

  #map{width:100%;height:100%;min-height:320px;}
  .map-wrap{position:relative;}
  .map-hint{
    position:absolute;top:10px;left:10px;z-index:1000;
    background:rgba(255,255,255,0.92);border:1px solid var(--line);
    padding:6px 10px;font-size:12px;font-family:var(--mono);
  }
  .coord{
    position:absolute;bottom:10px;left:10px;z-index:1000;
    background:rgba(255,255,255,0.92);border:1px solid var(--line);
    padding:6px 10px;font-size:11px;font-family:var(--mono);
  }

  .log{display:flex;flex-direction:column;gap:0;}
  .log-entry{border-bottom:1px solid var(--line);padding:10px 0;}
  .log-entry:last-child{border-bottom:none;}
  .log-entry .meta{font-family:var(--mono);font-size:11px;color:#666;margin-bottom:3px;}
  .log-entry .text{font-size:14px;}
  .empty{color:#888;font-size:13px;font-style:italic;padding:10px 0;}

  .name-badge{font-family:var(--mono);font-size:12px;background:var(--paper);border:1px solid var(--line);padding:6px 10px;display:flex;gap:8px;align-items:center;color:var(--ink);}
  .logout-link{font-family:var(--mono);font-size:11px;color:var(--paper);opacity:0.75;background:none;border:none;text-decoration:underline;padding:0;text-transform:none;font-weight:400;}
  .logout-link:hover{opacity:1;filter:none;}

  .login-overlay{
    position:fixed;inset:0;z-index:2000;
    background:rgba(27,29,28,0.92);
    display:flex;align-items:center;justify-content:center;
  }
  .login-box{
    background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--red);
    padding:24px;width:280px;
  }
  .login-box h2{font-size:13px;text-transform:uppercase;letter-spacing:0.06em;margin:0 0 14px;color:var(--red);}
  .login-error{color:var(--red);font-size:12px;margin-top:10px;min-height:14px;}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>Anmeldung</h2>
    <label for="loginKuerzel">Kürzel</label>
    <input type="text" id="loginKuerzel" placeholder="z.B. LL" maxlength="6">
    <label for="loginPin">Einsatz-PIN</label>
    <input type="password" id="loginPin" placeholder="PIN" inputmode="numeric">
    <div style="margin-top:14px;">
      <button id="btnLogin" style="width:100%;">Anmelden</button>
    </div>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<header>
  <div class="title">
    <h1>Einsatzleitung</h1>
    <span class="sub" id="einsatzIdLabel">— kein aktiver Einsatz —</span>
  </div>
  <div class="status-row">
    <span><span class="dot" id="syncDot"></span><span id="syncLabel">verbunden</span></span>
    <span id="lastUpdate">–</span>
    <span class="name-badge">Kürzel: <strong id="kuerzelLabel">–</strong></span>
    <button class="logout-link" id="btnLogout">Abmelden</button>
  </div>
</header>

<main>
  <div class="panel">

    <div class="card">
      <h2>Einsatz</h2>
      <label for="einsatzOrt">Einsatzort</label>
      <input type="text" id="einsatzOrt" placeholder="Adresse / Ortsbezeichnung">
      <div class="row2">
        <div>
          <label for="status">Status</label>
          <select id="status">
            <option>Alarmiert</option>
            <option>Anfahrt</option>
            <option selected>Vor Ort</option>
            <option>Sichtung läuft</option>
            <option>Abtransport läuft</option>
            <option>Abgeschlossen</option>
          </select>
        </div>
        <div>
          <label for="anzahlPatienten">Anzahl Patienten</label>
          <input type="number" id="anzahlPatienten" min="0" value="0">
        </div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button id="btnSaveEinsatz">Speichern</button>
        <button class="danger" id="btnNewEinsatz">Neuer Einsatz</button>
      </div>
    </div>

    <div class="card">
      <h2>Sichtungskategorien</h2>
      <div class="row2">
        <div><label>T1 (rot)</label><input type="number" id="t1" min="0" value="0"></div>
        <div><label>T2 (gelb)</label><input type="number" id="t2" min="0" value="0"></div>
        <div><label>T3 (grün)</label><input type="number" id="t3" min="0" value="0"></div>
        <div><label>T4 (blau)</label><input type="number" id="t4" min="0" value="0"></div>
      </div>
      <div class="field-note">Wird mit „Speichern" oben übernommen.</div>
    </div>

    <div class="card">
      <h2>Eintrag hinzufügen</h2>
      <textarea id="logText" placeholder="Beobachtung, Massnahme, Meldung ..."></textarea>
      <div style="margin-top:10px;">
        <button id="btnAddLog">Eintrag senden</button>
      </div>
    </div>

  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-hint">Klick auf Karte = Bereitstellungsort setzen/verschieben</div>
    <div class="coord" id="coordLabel">Bereitstellungsort: nicht gesetzt</div>
  </div>
</main>

<div class="panel" style="border-right:none;border-top:1px solid var(--line);">
  <div class="card" style="flex:1;">
    <h2>Verlauf</h2>
    <div class="log" id="logList"><div class="empty">Noch keine Einträge.</div></div>
  </div>
</div>

<script>
const TOKEN_KEY = "einsatz-token";
const KUERZEL_KEY = "einsatz-kuerzel";
const RECONNECT_BASE_MS = 1000;
const RECONNECT_MAX_MS = 15000;

let state = null;
let map, marker;
let ws = null;
let reconnectAttempts = 0;
let reconnectTimer = null;
let manualClose = false;

// --- Auth ---
function getToken(){ return sessionStorage.getItem(TOKEN_KEY); }
function getKuerzel(){ return sessionStorage.getItem(KUERZEL_KEY); }

function showLogin(message){
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginError').textContent = message || '';
}
function hideLogin(){
  document.getElementById('loginOverlay').style.display = 'none';
}

async function handleLogin(){
  const kuerzel = document.getElementById('loginKuerzel').value;
  const pin = document.getElementById('loginPin').value;
  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  try{
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ kuerzel, pin })
    });
    const data = await res.json();
    if(!res.ok){
      showLogin(data.error || 'Anmeldung fehlgeschlagen.');
      return;
    }
    sessionStorage.setItem(TOKEN_KEY, data.token);
    sessionStorage.setItem(KUERZEL_KEY, data.kuerzel);
    document.getElementById('loginPin').value = '';
    hideLogin();
    document.getElementById('kuerzelLabel').textContent = data.kuerzel;
    connectWs();
  }catch(e){
    showLogin('Server nicht erreichbar.');
  }finally{
    btn.disabled = false;
  }
}

function handleLogout(){
  manualClose = true;
  if(ws) ws.close();
  sessionStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(KUERZEL_KEY);
  state = null;
  showLogin();
}

// --- WebSocket ---
function connectWs(){
  const token = getToken();
  if(!token){ showLogin(); return; }
  manualClose = false;
  setSyncStatus('stale');

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws?token=${encodeURIComponent(token)}`);

  ws.onopen = () => {
    reconnectAttempts = 0;
    setSyncStatus('ok');
  };

  ws.onmessage = (evt) => {
    let msg;
    try{ msg = JSON.parse(evt.data); }catch(e){ return; }
    if(msg.type === 'state:full'){
      state = msg.payload;
      renderAll();
      setSyncStatus('ok');
    } else if(msg.type === 'error'){
      console.error('Server-Fehler:', msg.payload?.message);
    }
  };

  ws.onclose = (evt) => {
    setSyncStatus('error');
    if(manualClose) return;
    if(evt.code === 4401){
      // Token ungültig/abgelaufen -> neu anmelden statt endlos zu reconnecten.
      sessionStorage.removeItem(TOKEN_KEY);
      sessionStorage.removeItem(KUERZEL_KEY);
      showLogin('Sitzung abgelaufen, bitte erneut anmelden.');
      return;
    }
    scheduleReconnect();
  };

  ws.onerror = () => {
    // onclose übernimmt Reconnect-Logik
  };
}

function scheduleReconnect(){
  if(reconnectTimer) return;
  const delay = Math.min(RECONNECT_BASE_MS * Math.pow(2, reconnectAttempts), RECONNECT_MAX_MS);
  reconnectAttempts++;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    if(!getToken()){ showLogin(); return; }
    connectWs();
  }, delay);
}

function wsSend(type, payload){
  if(ws && ws.readyState === WebSocket.OPEN){
    ws.send(JSON.stringify({ type, payload }));
  } else {
    setSyncStatus('error');
  }
}

function setSyncStatus(kind){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  dot.className = 'dot' + (kind==='error' ? ' off' : (kind==='stale' ? ' stale' : ''));
  label.textContent = kind==='error' ? 'getrennt' : (kind==='stale' ? 'verbinde…' : 'verbunden');
  document.getElementById('lastUpdate').textContent = state ? ('Update: ' + new Date(state.updatedAt).toLocaleTimeString('de-CH')) : '–';
}

// --- Map ---
let mapReady = false;

function initMap(){
  try{
    map = L.map('map', {zoomControl:true}).setView([46.8800, 8.6350], 12); // Kanton Uri als Default-Zentrum
    L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg', {
      attribution: '© swisstopo',
      maxZoom: 18
    }).addTo(map);

    map.on('click', (e) => {
      setBereitstellungsort(e.latlng.lat, e.latlng.lng);
    });
    mapReady = true;
  }catch(e){
    console.error('Karte konnte nicht geladen werden:', e);
    const hint = document.querySelector('.map-hint');
    if(hint) hint.textContent = 'Karte nicht verfügbar (Verbindungsproblem).';
  }
}

function setBereitstellungsort(lat, lng){
  if(mapReady){
    if(marker){
      marker.setLatLng([lat,lng]);
    } else {
      marker = L.marker([lat,lng], {draggable:true}).addTo(map);
      marker.on('dragend', () => {
        const p = marker.getLatLng();
        wsSend('bereitstellungsort:set', {lat: p.lat, lng: p.lng});
      });
    }
  }
  wsSend('bereitstellungsort:set', {lat, lng});
}

// --- Render ---
function renderAll(){
  if(!state) return;
  document.getElementById('einsatzIdLabel').textContent = state.id + (state.ort ? ' — ' + state.ort : '');
  document.getElementById('einsatzOrt').value = state.ort || '';
  document.getElementById('status').value = state.status || 'Vor Ort';
  document.getElementById('anzahlPatienten').value = state.anzahlPatienten ?? 0;
  document.getElementById('t1').value = state.triage?.t1 ?? 0;
  document.getElementById('t2').value = state.triage?.t2 ?? 0;
  document.getElementById('t3').value = state.triage?.t3 ?? 0;
  document.getElementById('t4').value = state.triage?.t4 ?? 0;

  if(state.bereitstellungsort){
    const {lat,lng} = state.bereitstellungsort;
    document.getElementById('coordLabel').textContent = 'Bereitstellungsort: ' + lat + ', ' + lng;
    if(mapReady){
      if(marker){ marker.setLatLng([lat,lng]); }
      else { marker = L.marker([lat,lng], {draggable:true}).addTo(map);
        marker.on('dragend', () => { const p = marker.getLatLng(); wsSend('bereitstellungsort:set', {lat: p.lat, lng: p.lng}); });
      }
    }
  } else {
    if(mapReady && marker){ map.removeLayer(marker); marker = null; }
    document.getElementById('coordLabel').textContent = 'Bereitstellungsort: nicht gesetzt';
  }

  const list = document.getElementById('logList');
  const entries = state.log || [];
  if(entries.length === 0){
    list.innerHTML = '<div class="empty">Noch keine Einträge.</div>';
  } else {
    list.innerHTML = entries.map(e => `
      <div class="log-entry">
        <div class="meta">${new Date(e.zeit).toLocaleTimeString('de-CH')} · ${escapeHtml(e.person)}</div>
        <div class="text">${escapeHtml(e.text)}</div>
      </div>
    `).join('');
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Actions ---
function handleSaveEinsatz(){
  wsSend('einsatz:update', {
    ort: document.getElementById('einsatzOrt').value,
    status: document.getElementById('status').value,
    anzahlPatienten: parseInt(document.getElementById('anzahlPatienten').value || '0', 10),
    triage: {
      t1: parseInt(document.getElementById('t1').value || '0', 10),
      t2: parseInt(document.getElementById('t2').value || '0', 10),
      t3: parseInt(document.getElementById('t3').value || '0', 10),
      t4: parseInt(document.getElementById('t4').value || '0', 10),
    }
  });
}

function handleNewEinsatz(){
  if(!confirm('Neuen Einsatz starten? Der aktuelle Verlauf wird für alle ersetzt.')) return;
  wsSend('einsatz:new', {});
}

function handleAddLog(){
  const textEl = document.getElementById('logText');
  const text = textEl.value.trim();
  if(!text) return;
  wsSend('log:add', { text });
  textEl.value = '';
}

// --- Init ---
document.getElementById('btnSaveEinsatz').addEventListener('click', handleSaveEinsatz);
document.getElementById('btnNewEinsatz').addEventListener('click', handleNewEinsatz);
document.getElementById('btnAddLog').addEventListener('click', handleAddLog);
document.getElementById('btnLogin').addEventListener('click', handleLogin);
document.getElementById('btnLogout').addEventListener('click', handleLogout);
document.getElementById('loginPin').addEventListener('keydown', (e) => { if(e.key === 'Enter') handleLogin(); });

(function init(){
  initMap();
  const token = getToken();
  const kuerzel = getKuerzel();
  if(token && kuerzel){
    document.getElementById('kuerzelLabel').textContent = kuerzel;
    hideLogin();
    connectWs();
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
